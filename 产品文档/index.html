<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>家庭管理后台</title>
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div class="login-screen" id="loginScreen">
  <div class="login-aside">
    <div class="login-brand">
      <div class="login-logo">家</div>
      <strong>家庭管理后台</strong>
    </div>
    <div class="login-copy">
      <h1>一个地方，管好整个家</h1>
      <p>账目、试卷、照片、影片与学习笔记，登录后一屏掌握。</p>
      <ul>
        <li>家庭收支　收入支出与分类统计</li>
        <li>试卷档案　成绩跟踪与薄弱科目</li>
        <li>家庭影音　照片墙与影片库</li>
      </ul>
    </div>
    <p class="login-note">数据保存在本机浏览器，不会上传云端</p>
  </div>

  <div class="login-main">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-head">
        <h2>欢迎回来</h2>
        <p>登录后进入家庭管理后台</p>
      </div>
      <div class="form-item">
        <label for="loginUser">账号</label>
        <input class="control" id="loginUser" autocomplete="username" placeholder="请输入账号" />
      </div>
      <div class="form-item">
        <label for="loginPass">密码</label>
        <div class="input-affix">
          <input class="control" id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码" style="width:100%" />
          <button type="button" class="affix-btn" id="togglePass">显示</button>
        </div>
      </div>
      <div class="login-row">
        <label class="login-check"><input type="checkbox" id="rememberMe" /> 记住我（7 天免登录）</label>
        <a class="login-link" id="forgotLink" href="javascript:void(0)">忘记密码？</a>
      </div>
      <div class="login-error" id="loginError" hidden></div>
      <button class="btn btn-primary login-submit" id="loginBtn" type="submit">登录</button>
      <div class="login-hint">演示环境　账号 admin　密码 123456</div>
    </form>
  </div>
</div>

<div class="app-shell" id="appShell" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">家</div>
      <div class="brand-text">
        <strong>家庭管理后台</strong>
        <span>Family Admin</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>家庭概览</span>
      </button>
      <button class="nav-item" data-view="finance">
        <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15.5l3.4-4.2 2.6 2.4L20 7"/></svg>
        <span>收入支出</span>
      </button>
      <button class="nav-item" data-view="exam">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 9.5h6"/><path d="M9 13h6"/><path d="M9 16.5h3.5"/></svg>
        <span>试卷管理</span>
      </button>
      <button class="nav-item" data-view="photo">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M3 16.5l4.5-4 3.5 3 3-2.5L21 16"/></svg>
        <span>照片管理</span>
      </button>
      <button class="nav-item" data-view="movie">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14"/><path d="M17 5v14"/><path d="M11 10l3.5 2L11 14z"/></svg>
        <span>影片管理</span>
      </button>
      <button class="nav-item" data-view="notes">
        <svg viewBox="0 0 24 24"><path d="M8 3h7l5 5v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v5h5"/><path d="M9.5 13.5h6"/><path d="M9.5 17h4"/></svg>
        <span>学习笔记</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="member-card">
        <div class="avatar">家</div>
        <div class="member-info">
          <strong id="memberName">家庭成员</strong>
          <span>管理员</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%;margin-top:12px">退出登录</button>
      <p class="sidebar-note">数据保存在本机浏览器<br />不会上传至云端</p>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">家庭概览</h1>
        <p id="pageDesc">家庭成员的共同视图：账目、试卷、影音与笔记</p>
      </div>
      <div class="topbar-right">
        <label class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <input id="globalSearch" type="search" placeholder="搜索账目、试卷、照片、影片…" autocomplete="off" />
        </label>
        <div class="data-actions">
          <button class="btn btn-ghost" data-act="reset">重置数据</button>
          <button class="btn btn-primary" data-act="new-tx">
            <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            <span>记一笔</span>
          </button>
        </div>
      </div>
    </header>

    <div class="content">
      <section class="view is-active" id="view-dashboard"></section>
      <section class="view" id="view-finance"></section>
      <section class="view" id="view-exam"></section>
      <section class="view" id="view-photo"></section>
      <section class="view" id="view-movie"></section>
      <section class="view" id="view-notes"></section>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" hidden></div>
<div class="toast-root" id="toastRoot"></div>

<script src="assets/js/markdown.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
