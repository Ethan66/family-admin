[package]
name = "family-admin-desktop"
version = "1.0.0"
description = "Family Admin desktop application"
authors = ["Family Admin"]
edition = "2024"

[lib]
name = "family_admin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
kamadak-exif = "0.6.1"
hex = "0.4"
imagesize = "0.15"
opener = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
