spring:
  application:
    name: family-admin-server
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/family_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:family_admin}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

family-admin:
  security:
    jwt-secret: ${JWT_SECRET:replace-this-development-secret-with-at-least-32-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  storage:
    root: ${STORAGE_ROOT:../storage}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:123}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:超级管理员}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
